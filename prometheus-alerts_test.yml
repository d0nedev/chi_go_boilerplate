# promtool test rules prometheus-alerts_test.yml
rule_files:
  - prometheus-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{exported_job="chi-product-api",http_response_status_code="200"}'
        values: '0+100x20'
      - series: 'http_server_request_duration_seconds_count{exported_job="chi-product-api",http_response_status_code="500"}'
        values: '0+5x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ServiceHighErrorRate
        exp_alerts:
          - exp_labels: { severity: page, service: chi-product-api }
            exp_annotations:
              summary: "5xx ratio 4.762% (SLO 99.9%)"
              runbook: docs/runbook.md#servicehigherrorrate
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{exported_job="chi-product-api",http_response_status_code="200"}'
        values: '0+100x20'
      - series: 'http_server_request_duration_seconds_count{exported_job="chi-product-api",http_response_status_code="500"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ServiceHighErrorRate
        exp_alerts: []
